name: Build FunctionScript EXE
run-name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装 Nuitka
        run: pip install --upgrade pip; pip install nuitka

      - name: 安装 Dependency Walker
        shell: cmd
        run: choco install dependency-walker -y

      - name: Nuitka 打包
        shell: cmd
        run: python -m nuitka --onefile --windows-console-mode=disable --python-flag=-O --enable-plugin=tk-inter --enable-option-dependent-executables-to-depend-on-pythldll64 --include-data-file=syntax.json=syntax.json FunctionScript.py

      - name: 上传成品 EXE
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Win-EXE
          path: FunctionScript.exe
          retention-days: 30
