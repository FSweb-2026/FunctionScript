name: Build FunctionScript EXE
run-name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装Nuitka
        run: python -m pip install --upgrade pip; pip install nuitka

      - name: Nuitka打包
        run: python -m nuitka --onefile --windows-console-mode=disable --python-flag=-O --include-data-file=index.json=. --include-data-file=syntax.json=. FunctionScript.py

      - name: 上传成品EXE
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Win-EXE
          path: FunctionScript.exe
          retention-days: 30
