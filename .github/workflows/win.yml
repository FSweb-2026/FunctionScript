name: Build FunctionScript EXE
run-name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 支持网页手动点按钮触发打包（推荐！不用提交代码也能跑）

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库全部源码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 升级pip、安装Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Nuitka 打包（单文件EXE，包含index.json + syntax.json）
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --python-flag=-O `
            --no-debug `
            --include-data-file=index.json=. `
            --include-data-file=syntax.json=. `
            FunctionScript.py

      - name: 上传生成的EXE（打包完成后在Workflow页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Windows-EXE
          path: FunctionScript.exe
          retention-days: 30
