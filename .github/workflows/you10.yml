name: BuildWinOnly
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python3.11 via winget (pure, no conda)
        run: |
          winget install Python.Python.3.11 --silent
          # 把新装python加入PATH当前会话
          $env:PATH = "C:\Program Files\Python311;C:\Program Files\Python311\Scripts;" + $env:PATH
          [Environment]::SetEnvironmentVariable('PATH',$env:PATH,"Process")

      - name: Verify python version
        run: python --version

      - name: Install nuitka + pefile
        run: python -m pip install -r requirements.txt

      - name: Nuitka build onefile exe
        run: >
          python -m nuitka
          --onefile
          --enable-plugin=tk-inter
          --windows-dependency-tool=pefile
          --assume-yes-for-downloads
          FunctionScript.py

      - name: Upload artifact exe
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript‑Windows
          path: FunctionScript.exe
