name: Build FunctionScript

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clear conda from PATH
        run: |
          $env:PATH = $env:PATH -replace ".*Miniconda.*?;", ""
          $env:CONDA_PREFIX=""
        shell: powershell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps (nuitka + pefile)
        run: python -m pip install -r requirements.txt
        shell: powershell

      - name: Build Windows onefile EXE
        run: python -m nuitka --onefile --enable-plugin=tk-inter --windows-dependency-tool=pefile --assume-yes-for-downloads FunctionScript.py
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Windows
          path: FunctionScript.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build Linux single‑file binary
        run: python -m nuitka --onefile --enable-plugin=tk-inter FunctionScript.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Linux
          path: FunctionScript

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build Mac app bundle
        run: |
          python -m nuitka --standalone --enable-plugin=tk-inter --macos-create-app-bundle FunctionScript.py
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Mac
          path: FunctionScript.app
