name: Build FunctionScript

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: python -m pip install -r requirements.txt

      - name: Build Windows onefile EXE via Nuitka‑Action
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: FunctionScript.py
          mode: onefile
          enable-plugins: tk-inter
          nuitka-args: --windows-dependency-tool=pefile --assume-yes-for-downloads

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Windows
          path: FunctionScript.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build Linux single‑file binary (--onefile)
        run: python -m nuitka --onefile --enable-plugin=tk-inter FunctionScript.py

      - name: Debug list output files
        run: ls -la

      # 这里上传的路径就是单个文件 FunctionScript
      - name: Upload Linux single‑file artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Linux
          path: ./FunctionScript

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build Mac app bundle
        run: python -m nuitka --standalone --enable-plugin=tk-inter --macos-create-app-bundle FunctionScript.py

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Mac
          path: FunctionScript.app
