name: Build-Linux-Only
on:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          sudo apt update
          sudo apt install -y python3-tk xorg xvfb

      - name: Nuitka build onefile single binary
        run: |
          xvfb-run python -m nuitka --onefile --enable-plugin=tk-inter --disable-console FunctionScript.py

      - name: List files (debug check)
        run: ls -la
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Linux-bin
          path: FunctionScript
          if-no-files-found: error
