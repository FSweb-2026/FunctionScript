name: Build Linux FunctionScript
on:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          sudo apt update
          sudo apt install -y python3-tk

      - name: Nuitka build onefile (single binary)
        run: |
          python -m nuitka --onefile --enable-plugin=tk-inter FunctionScript.py

      - name: Upload single binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionScript-Linux-bin
          path: FunctionScript
