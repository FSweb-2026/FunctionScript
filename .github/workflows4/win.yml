name: Build Windows FunctionScript

on:
  push:
    tags:
      - 'v*'  # 打tag（v0.0这种版本标签）的时候自动打包
  workflow_dispatch: # 网页上可以手动点运行工作流

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout 拉取仓库源码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Nuitka 打包EXE（包含 syntax.json）
        run: |
          python -m nuitka --onefile `
          --windows-console-mode=disable `
          --include-data-file=syntax.json=. `
          FunctionScript.py

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: FunctionScript.exe

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FunctionScript.exe
